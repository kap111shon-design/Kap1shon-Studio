
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>Kap1shon Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090914;color:white;
 font-family:Arial,sans-serif;
}
header{
 padding:22px 18px;background:#151526;
 border-bottom:1px solid #292943;
 font-size:23px;font-weight:bold;
}
.logo{color:#9875ff}
main{padding:22px 17px}
h1{font-size:27px;margin-top:35px}
p{color:#aaaabb;line-height:1.5}
.panel{
 background:#171727;border:1px solid #33334d;
 padding:18px;border-radius:16px;margin-top:25px;
}
textarea{
 width:100%;height:145px;resize:none;
 background:#0d0d19;color:white;
 border:1px solid #41415c;border-radius:12px;
 padding:14px;font-size:16px;outline:none;
}
button{
 width:100%;padding:16px;margin-top:15px;
 border:0;border-radius:12px;
 background:linear-gradient(90deg,#7955ff,#a34dff);
 color:white;font-size:17px;font-weight:bold;
}
button:active{opacity:.8}
#result{
 display:none;margin-top:20px;
 padding:15px;background:#202038;
 border-radius:12px;line-height:1.5;
}
footer{
 text-align:center;color:#666;padding:35px 10px;
 font-size:12px;
}
</style>
</head>
<body>

<header>
🚀 <span class="logo">Kap1shon</span> Studio
</header>

<main>
<h1>Создай приложение своей мечты</h1>

<p>
Твой личный конструктор приложений и игр.
Опиши свою идею на русском языке!
</p>

<div class="panel">
<h3>✨ Что будем создавать?</h3>

<textarea id="idea"
placeholder="Например: создай игру про гонки с красивыми машинами..."></textarea>

<button onclick="createApp()">
🚀 Создать приложение
</button>

<div id="result"></div>
</div>

<div class="panel">
<h3>🤖 Kap1shon AI</h3>
<p>
Помощник для создания игр, приложений и новых проектов.
</p>
</div>

</main>

<footer>
Kap1shon Studio © 2026
</footer>

<script>
function createApp(){
 const idea=document.getElementById('idea').value.trim();
 const result=document.getElementById('result');

 if(!idea){
  alert('Сначала опиши свою идею!');
  return;
 }

 result.style.display='block';
 result.innerHTML=
 '✅ Идея принята!<br><br>'+
 '<b>Твой проект:</b><br>'+ 
 idea.replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 }[c]))+
 '<br><br>🤖 Модуль генерации ИИ будет подключён следующим этапом.';
}
</script>

</body>
</html>
